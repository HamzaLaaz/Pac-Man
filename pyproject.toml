[project]
name = "pac-mac-github"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bdfparser>=2.2.0",
    "mazegenerator",
    "mlx",
    "pytest>=9.1.1",
]

[tool.uv.sources]
mlx = { path = "mlx/mlx-2.2-py3-none-any.whl" }
mazegenerator = { path = "mazegenerator/mazegenerator-2.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
exclude = ["^\\.venv/"]
